name: Build & Publish Manga Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  ALIAS: ${{ secrets.ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "SIGNING_KEY secret is missing; building unsigned APKs"
            exit 0
          fi
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks
          test -s signingkey.jks || {
            echo "Decoded signingkey.jks is empty; check the SIGNING_KEY secret"
            exit 1
          }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all extensions
        run: ./gradlew assembleRelease

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-extension-apks
          path: '**/build/outputs/apk/**/*.apk'
          retention-days: 7

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: manga-extension-apks
          path: apks

      - name: Collect extension icons
        run: |
          mkdir -p repo/icons
          for dir in main/src/all/*/; do
            ext=$(basename "$dir")
            icon="$dir/res/mipmap-xxxhdpi/ic_launcher.png"
            if [ -f "$icon" ]; then
              cp "$icon" "repo/icons/all.$ext.png"
            fi
          done

      - name: Publish APKs and update index
        run: |
          python main/.github/scripts/publish_extensions.py \
            --apk-dir apks \
            --repo-dir repo \
            --icons-dir repo/icons

      - name: Commit and push
        working-directory: repo
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update manga extensions"
            git push
          else
            echo "No changes to publish"
          fi
